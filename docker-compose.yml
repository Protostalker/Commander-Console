services:
  connector:
    build: ./connector
    ports:
      - "8100:8100"
    environment:
      COMMANDER_PASSWORD: ${COMMANDER_PASSWORD:-}
    volumes:
      - ./config:/app/config:ro
      - ccdata:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"  # allows reaching Commander on LAN
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "5010:80"
    depends_on:
      - connector
    restart: unless-stopped

volumes:
  ccdata:
